# Builds the project with Maven and runs the TestNG suite (testng.xml,
# wired via pom.xml's surefire config) on every push.

name: FreeApp Selenium Test Suite

on:
  push:
    branches:
      - main

jobs:
  selenium-tests:
    # "runs-on" is which hosted machine GitHub gives this job - the test
    # suite never actually runs on your own laptop in CI, only on this
    # remote runner (that's also why xvfb below is needed - a real desktop
    # doesn't need a virtual display, but a remote runner has no screen at
    # all). ubuntu-latest is the standard default: on public repos every
    # OS below is free with unlimited minutes; on private repos, Actions
    # minutes bill per OS - Linux at the base (1x) rate, Windows at 2x,
    # macOS at 10x - so Ubuntu is the default unless a job specifically
    # needs Windows- or macOS-only behavior.
    runs-on: ubuntu-latest
    # runs-on: windows-latest
    # runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Chrome ships on ubuntu-latest, but it can't open a window with no
      # display attached - xvfb gives it a virtual one so it can launch on
      # a headless CI runner the same way it does on a normal desktop.
      - name: Install a virtual display for Chrome
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        run: xvfb-run -a mvn test

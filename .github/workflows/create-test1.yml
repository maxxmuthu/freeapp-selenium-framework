# Builds the project with Maven and runs the TestNG suite (testng.xml,
# wired via pom.xml's surefire config) on every push.

name: FreeApp Selenium Test Suite

on:
  push:
    branches:
      - main

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Chrome ships on ubuntu-latest, but it can't open a window with no
      # display attached - xvfb gives it a virtual one so it can launch on
      # a headless CI runner the same way it does on a normal desktop.
      - name: Install a virtual display for Chrome
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        run: xvfb-run -a mvn test
